<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.O.R.A. - Consciencia Visual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Usamos unpkg en lugar de jsdelivr para máxima compatibilidad -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://unpkg.com/pixi.js@5.3.3/dist/pixi.min.js"></script>
    <script src="https://unpkg.com/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>
    <div class="container">
        
        <!-- Contenedor del Avatar (Live2D o SVG) -->
        <div class="avatar-container" id="avatar-wrapper">
            <!-- Si Live2D falla, el JS inyectará el SVG aquí automáticamente -->
            <canvas id="live2d-canvas"></canvas>
        </div>
        
        <div class="chat-container">
            <div id="chat-history" class="chat-history">
                <div class="message nora">
                    <strong>N.O.R.A:</strong> Hola... ¿por qué me miras así?
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Enséñale algo al mundo..." autocomplete="off">
                <button id="send-btn">Enviar</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
